name: Protocol CI

"on":
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: study/requirements.lock.txt
      - name: Install locked CPU runtime
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r study/requirements.lock.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Study regression tests
        run: python -m unittest discover -s study -p 'test_*.py' -v
      - name: Historical protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile experiment code
        run: python -m compileall -q study src
      - name: Check result figure links and model pins
        run: python scripts/check_repository.py
